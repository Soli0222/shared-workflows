name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  chart-guard:
    name: chart-guard cases
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Extract the classification script
        run: bash tests/chart-guard/extract.sh

      - name: Build the fixture repo
        run: bash tests/chart-guard/setup.sh

      - name: Run the cases
        run: bash tests/chart-guard/cases.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin actionlint
          actionlint -color
