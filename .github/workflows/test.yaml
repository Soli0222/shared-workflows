name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  chart-guard:
    name: chart-guard cases
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Extract the classification script
        run: bash tests/chart-guard/extract.sh

      - name: Build the fixture repo
        run: bash tests/chart-guard/setup.sh

      - name: Run the cases
        run: bash tests/chart-guard/cases.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin actionlint
          # 除外している2件はどちらも actionlint 側のメタデータが追いついていない
          # だけで、実際には動く。
          #
          # - concurrency.queue: 1.7.12 のスキーマにまだ無い。publish-chart は
          #   これで chart の採番と publish を排他しているので外せない
          # - create-github-app-token の client-id: actionlint が持っている
          #   action 定義が app-id しか知らない。client-id は他の全リポジトリの
          #   renovate workflow で実際に使えている
          actionlint -color \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            -ignore 'actions/create-github-app-token'
