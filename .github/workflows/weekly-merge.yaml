name: Weekly Release PR Merge

# 呼び出し専用。起動経路 (schedule / workflow_dispatch) は各アプリ側の
# weekly-release.yaml に置く。reusable workflow の `github` context は
# 呼び出し元アプリのものになる。secrets (RENOVATE_CLIENT_ID /
# RENOVATE_PRIVATE_KEY) は呼び出し側が `secrets: inherit` で渡す。
#
# 各リポジトリに分散していた週次 release-please PR 自動マージの共通化版。
# 実装の差分 (ブランチ名の判定) によってマージされない PR が生じたため、
# 判定は呼び出し元の既定ブランチから導出してリポジトリ非依存にした。
on:
  workflow_call:
    inputs:
      required-checks:
        description: |
          追加で必須にする check の名前 (改行かカンマ区切り)。列挙した check は
          存在し、SUCCESS で完了している必要がある。空なら追加の条件は無い。
          指定の有無にかかわらず、check が1つ以上あり、すべて SUCCESS / NEUTRAL /
          SKIPPED で完了していることを要求する。
        required: false
        type: string
        default: ""

jobs:
  merge:
    name: Merge only the checked release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          repositories: ${{ github.event.repository.name }}
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Merge only the checked release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
        run: |
          set -euo pipefail

          required="$(printf '%s\n' "${REQUIRED_CHECKS}" | tr ',' '\n' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' \
            | jq -R . | jq -s -c .)"

          # manifest モードの release-please ブランチは
          # release-please--branches--<base>--components--<component>。
          # component は release-type によって空になる (go 等) ため、
          # suffix あり・なしの両方を対象にする。
          branch_prefix="release-please--branches--${BASE_BRANCH}"

          prs="$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_BRANCH}" --label 'autorelease: pending' \
            --state open --json number,headRefName,isDraft,author)"

          candidates="$(echo "${prs}" | jq --arg app "${RELEASE_APP_SLUG}" \
            --arg prefix "${branch_prefix}" '
            [.[] | select(
              .isDraft == false
              and .author.is_bot == true
              and (((.author.login // "")
                     | sub("^app/"; "") | sub("\\[bot\\]$"; "")) == $app)
              and (.headRefName == $prefix
                   or (.headRefName | startswith($prefix + "--components--")))
            )]')"

          count="$(echo "${candidates}" | jq 'length')"
          if [ "${count}" -gt 1 ]; then
            echo "Multiple release PRs found; refusing to select one." >&2
            exit 1
          fi
          if [ "${count}" -eq 0 ]; then
            echo "No pending release-please PR."
            exit 0
          fi

          number="$(echo "${candidates}" | jq -r '.[0].number')"
          echo "Pending release PR: #${number}"

          view="$(gh pr view "${number}" --repo "${GITHUB_REPOSITORY}" \
            --json headRefOid,statusCheckRollup,mergeStateStatus)"

          # マージしないときは理由を warning と Step Summary に残す。
          # run は成功のままにする (CI が正当に失敗しているときに通知が増えないように)。
          leave_open() {
            echo "::warning::Release PR #${number} is not ready ($1); leaving it open."
            printf 'Release PR #%s was not merged: %s\n' "${number}" "$1" \
              >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          }

          # check run は name / status / conclusion を、commit status は
          # context / state を持つ。
          checks="$(echo "${view}" | jq -c '.statusCheckRollup // []
            | map({
                name: (.name // .context // ""),
                done: (if has("status") then .status == "COMPLETED" else .state != "PENDING" and .state != "EXPECTED" end),
                result: (if has("status") then (.conclusion // "") else (.state // "") end)
              })')"

          # check が1つも無いときはマージしない (CI がまだ始まっていない可能性がある)。
          if [ "$(echo "${checks}" | jq 'length')" -eq 0 ]; then
            leave_open "no checks have been reported"
          fi

          missing="$(echo "${checks}" | jq -r --argjson required "${required}" '
            [.[].name] as $names
            | [$required[] | select(. as $n | $names | index($n) | not)]
            | join(", ")')"
          if [ -n "${missing}" ]; then
            leave_open "required checks not found: ${missing}"
          fi

          # すべての check が完了して SUCCESS / NEUTRAL / SKIPPED であること。
          # required-checks に挙げた check は SUCCESS に限る。
          not_ready="$(echo "${checks}" | jq -r --argjson required "${required}" '
            [.[] | select(
                (.done | not)
                or (if (.name | IN($required[])) then .result != "SUCCESS"
                    else (.result | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not) end))
              | "\(.name)=\(if .done then .result else "PENDING" end)"]
            | join(", ")')"
          if [ -n "${not_ready}" ]; then
            leave_open "checks not successful: ${not_ready}"
          fi

          merge_state="$(echo "${view}" | jq -r '.mergeStateStatus')"
          if [ "${merge_state}" != "CLEAN" ]; then
            leave_open "merge state is ${merge_state}"
          fi

          # 検証した head SHA を指定し、検証後に更新された PR はマージしない。
          gh pr merge "${number}" --repo "${GITHUB_REPOSITORY}" \
            --squash --match-head-commit "$(echo "${view}" | jq -r '.headRefOid')"
